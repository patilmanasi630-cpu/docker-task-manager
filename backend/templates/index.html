```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .delete-btn {
            background: #e74c3c;
            padding: 8px 12px;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        @media (max-width: 500px) {
            .input-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <p class="subtitle">
            Full-Stack Docker Application
        </p>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <ul id="taskList"></ul>

        <div class="status" id="status">
            Loading tasks...
        </div>

    </div>

    <script>

        async function loadTasks() {

            try {

                const response = await fetch("/tasks");
                const tasks = await response.json();

                const list = document.getElementById("taskList");

                list.innerHTML = "";

                tasks.forEach(task => {

                    const li = document.createElement("li");

                    li.innerHTML = `
                        <span>${task.title}</span>

                        <button
                            class="delete-btn"
                            onclick="deleteTask(${task.id})">
                            Delete
                        </button>
                    `;

                    list.appendChild(li);
                });

                document.getElementById("status").textContent =
                    `${tasks.length} task(s)`;

            } catch (error) {

                document.getElementById("status").textContent =
                    "Unable to connect to server";
            }
        }


        async function addTask() {

            const input = document.getElementById("taskInput");

            const title = input.value.trim();

            if (!title) {

                alert("Please enter a task");

                return;
            }

            await fetch("/tasks", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title
                })
            });

            input.value = "";

            loadTasks();
        }


        async function deleteTask(id) {

            await fetch(`/tasks/${id}`, {
                method: "DELETE"
            });

            loadTasks();
        }


        loadTasks();

    </script>

</body>

</html>
