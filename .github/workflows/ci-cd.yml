name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Lint Python code
        run: |
          flake8 backend --exclude=templates

      - name: Run unit tests
        run: |
          pytest


  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t task-manager:latest .

      - name: Verify Docker image
        run: |
          docker images task-manager:latest