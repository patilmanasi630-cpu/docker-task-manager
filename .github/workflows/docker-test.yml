name: Docker Build and Test

on:
  push:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          pwd
          ls -la
          test -f Dockerfile
          test -f docker-compose.yml
          test -f backend/app.py
          test -f backend/requirements.txt
          echo "All required files found."

      - name: Build Docker image
        run: docker build -t task-manager:latest .

      - name: Check image size
        run: |
          SIZE=$(docker image inspect task-manager:latest --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"

          if [ "$SIZE_MB" -ge 150 ]; then
            echo "Image is 150 MB or larger."
            exit 1
          fi

          echo "Image size is below 150 MB."

      - name: Start containers
        run: docker compose -f docker-compose.yml up -d

      - name: Show containers
        run: docker compose -f docker-compose.yml ps

      - name: Wait for application
        run: |
          for i in {1..30}
          do
            if curl -fs http://localhost:5000/health
            then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Health check failed."
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Check non-root user
        run: |
          USER_NAME=$(docker compose -f docker-compose.yml exec -T web whoami)
          echo "Container user: $USER_NAME"

          if [ "$USER_NAME" != "appuser" ]
          then
            echo "Non-root test failed."
            exit 1
          fi

          echo "Non-root test passed."

      - name: Add test task
        run: |
          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"title":"Persistence Test"}' \
            http://localhost:5000/tasks

      - name: Check task
        run: |
          curl -fsS http://localhost:5000/tasks
          echo ""

      - name: Restart containers
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d

      - name: Check persistence
        run: |
          for i in {1..30}
          do
            if curl -fs http://localhost:5000/health
            then
              break
            fi

            sleep 2
          done

          TASKS=$(curl -fsS http://localhost:5000/tasks)

          echo "$TASKS"

          echo "$TASKS" | grep -q "Persistence Test"

          echo "Persistence test passed."

      - name: Show logs
        if: always()
        run: docker compose -f docker-compose.yml logs

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down
