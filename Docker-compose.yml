services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-manager:latest

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U taskuser -d taskdb"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: